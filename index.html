<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Recorder & Google Sheet Sync</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background-color: #f4f7f6;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      margin: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    #startBtn {
      background-color: #28a745;
      color: white;
    }
    #startBtn:disabled {
      background-color: #a5d6a7;
      cursor: not-allowed;
    }
    #stopBtn {
      background-color: #dc3545;
      color: white;
    }
    #stopBtn:disabled {
      background-color: #ef9a9a;
      cursor: not-allowed;
    }
    #status {
      margin-top: 25px;
      font-size: 16px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Audio Recorder</h2>
    
    <button id="startBtn" onclick="startRecording()">Start Recording</button>
    <button id="stopBtn" onclick="stopRecording()" disabled>Stop / Disconnect</button>

    <div id="status">Status: तैयार है (Ready)</div>
  </div>

  <script>
    // 1. आपके सेट किए गए Web App URL और Drive Folder ID
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzdZ0GG5AOX3gRD8WfORDECqk9vrF0KHGtk_d79E1fpGYDy_5zFvfSuFQ8qN1zXKWC-hw/exec";
    const DRIVE_FOLDER_ID = "1iu1zHEtiifpPyucDJMN1MrjKxsL3Osf0";

    let mediaRecorder;
    let audioChunks = [];

    // 2. रिकॉर्डिंग स्टार्ट करने का फ़ंक्शन
    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = event => {
          if (event.data.size > 0) {
            audioChunks.push(event.data);
          }
        };

        mediaRecorder.start();
        document.getElementById("status").innerText = "Status: 🔴 रिकॉर्डिंग चालू है...";
        document.getElementById("startBtn").disabled = true;
        document.getElementById("stopBtn").disabled = false;
      } catch (err) {
        alert("माइक्रोफ़ोन एक्सेस करने में समस्या आई: " + err.message);
      }
    }

    // 3. रिकॉर्डिंग रोकने का फ़ंक्शन
    function stopRecording() {
      if (!mediaRecorder) return;

      document.getElementById("status").innerText = "Status: ⏳ ऑडियो प्रोसेस हो रहा है...";
      document.getElementById("stopBtn").disabled = true;

      mediaRecorder.stop();

      // जब रिकॉर्डिंग पूरी तरह बंद हो जाए तब डेटा बैकएंड को भेजें
      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        stopAndSendRecording(audioBlob);
      };
    }

    // 4. Drive और Sheet में ऑडियो डेटा भेजने का ऑटोमैटिक फ़ंक्शन
    async function stopAndSendRecording(audioBlob) {
      document.getElementById("status").innerText = "Status: ⏳ Google Drive और Sheet में भेजा जा रहा है...";

      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);

      reader.onloadend = function () {
        const base64Data = reader.result.split(',')[1];

        const payload = {
          filename: "Audio_Record_" + new Date().getTime() + ".wav",
          mimeType: "audio/wav",
          base64: base64Data,
          folderId: DRIVE_FOLDER_ID,
          timestamp: new Date().toLocaleString()
        };

        fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          if (data.result === "success") {
            document.getElementById("status").innerText = "Status: ✅ रिकॉर्डिंग सफलतापूर्व भेज दी गई!";
            alert("Recording Safaltapurvak Bheji Gayi!");
          } else {
            document.getElementById("status").innerText = "Status: ❌ एरर: " + data.error;
          }
          document.getElementById("startBtn").disabled = false;
        })
        .catch(err => {
          console.error("Error:", err);
          document.getElementById("status").innerText = "Status: ❌ अपलोडिंग में समस्या आई।";
          document.getElementById("startBtn").disabled = false;
        });
      };
    }
  </script>

</body>
</html>
